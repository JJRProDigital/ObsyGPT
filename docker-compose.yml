services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: obsygpt-postgres
    environment:
      POSTGRES_DB: obsygpt
      POSTGRES_USER: obsygpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsygpt_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - obsygpt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsygpt -d obsygpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: obsygpt-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://obsygpt:${POSTGRES_PASSWORD:-obsygpt_dev_password}@postgres:5432/obsygpt
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      OBSYGPT_REQUIRE_STRONG_SECRETS: ${OBSYGPT_REQUIRE_STRONG_SECRETS:-}
      AGENT_WORKSPACE_ROOT: /data/workspace
      VOICE_DATA_DIR: /app/voice-data
      HF_HOME: /app/voice-data/hf
      FASTEMBED_CACHE_PATH: /app/voice-data/fastembed
      VOICE_STT_MODEL: ${VOICE_STT_MODEL:-medium}
      VOICE_STT_LANGUAGE: ${VOICE_STT_LANGUAGE:-es}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-es_ES-sharvard-medium}
      # Google Flow MCP (only seeded when FLOW_MCP_URL is set; see services/flow-mcp).
      FLOW_MCP_URL: ${FLOW_MCP_URL:-}
      MCP_TOOL_TIMEOUT: ${MCP_TOOL_TIMEOUT:-180}
    volumes:
      - obsygpt_workspace:/data/workspace
      # Durable Agent Skills mirror (SKILL.md + imported .skill resources).
      # Matches SKILLS_ROOT (/agents/skills) inside the backend container.
      - ./agents/skills:/agents/skills
      # Generated Flow images land inside the agent workspace so file tools can reach them.
      # Override FLOW_DATA_DIR/FLOW_UPLOADS_DIR with absolute host paths on Dokploy/VPS:
      # relative paths live inside Dokploy's per-release dir and are wiped on every deploy.
      - ${FLOW_DATA_DIR:-./data/flow-images}:/data/workspace/flow-images
      # User drop folder for reference images: agent can list it, flow-mcp uploads from it.
      - ${FLOW_UPLOADS_DIR:-./data/flow-uploads}:/data/workspace/uploads
      # Chat attachments on a shared volume so the flow-mcp container can upload them
      # to Google Flow by their backend storage path.
      - obsygpt_uploads:/app/uploads
      - obsygpt_voice_data:/app/voice-data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional (docker compose --profile flow up -d): Google Flow (Nano Banana) image
  # generation as a URL MCP. One-time Google sign-in via noVNC at :6901.
  flow-mcp:
    build: ./services/flow-mcp
    container_name: obsygpt-flow-mcp
    profiles: ["flow"]
    volumes:
      - obsygpt_flow_profile:/config/flow-profile
      # Same folder at BOTH paths: /data/images (legacy tool output) and the
      # agent-visible path, so flow_upload_file resolves what the model sees.
      - ${FLOW_DATA_DIR:-./data/flow-images}:/data/images
      - ${FLOW_DATA_DIR:-./data/flow-images}:/data/workspace/flow-images
      - ${FLOW_UPLOADS_DIR:-./data/flow-uploads}:/data/uploads
      # Same folder at the agent-visible path so filePaths resolve identically.
      - ${FLOW_UPLOADS_DIR:-./data/flow-uploads}:/data/workspace/uploads
      - obsygpt_workspace:/data/workspace
      # Read-only view of chat attachments (backend storage paths) for flow_upload_file.
      - obsygpt_uploads:/app/uploads:ro
    ports:
      - "${FLOW_NOVNC_PORT:-6901}:6901"
    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: frontend-modern/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    container_name: obsygpt-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  obsygpt_voice_data:
  obsygpt_postgres_data:
  obsygpt_workspace:
  obsygpt_flow_profile:
  obsygpt_uploads:
