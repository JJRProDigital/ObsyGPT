server {
    listen 80;
    server_name _;

    # Chat attachments (photos, PDFs): nginx's 1M default rejects them with 413.
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Landing (panel-only build): exact root serves the static landing when
    # present; otherwise falls through to the SPA so public snapshots keep
    # working without it.
    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html /app/index.html;
    }

    location /shots/ {
        alias /usr/share/nginx/landing/shots/;
        add_header Cache-Control "public, max-age=86400";
    }

    location /docs/ {
        alias /usr/share/nginx/docs/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location = /docs {
        absolute_redirect off;
        return 308 /docs/;
    }

    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /app {
        absolute_redirect off;
        return 308 /app/;
    }

    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
