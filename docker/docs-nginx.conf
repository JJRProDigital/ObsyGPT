server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(png|jpg|jpeg|gif|svg|woff2|ico)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }
}
