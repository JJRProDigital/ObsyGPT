<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ObsyGPT — workspace de agentes IA self-hosted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132320"/>
      <stop offset="0.55" stop-color="#1e312f"/>
      <stop offset="1" stop-color="#152422"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#d5b06d" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#d5b06d" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d5b06d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#f1efea" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#f1efea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#f1efea" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5b06d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d5b06d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d5b06d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>
  <rect x="0" y="297" width="1200" height="3" fill="url(#rule)"/>

  <!-- brand mark -->
  <g transform="translate(600,86)">
    <circle r="30" fill="#f1efea" stroke="#d5b06d" stroke-width="3.5"/>
    <circle r="30" fill="none" stroke="#d5b06d" stroke-opacity="0.35" stroke-width="7"/>
    <text y="11" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="26" fill="#1e312f">OS</text>
  </g>

  <text x="600" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="58" letter-spacing="1" fill="#f1efea">ObsyGPT</text>

  <text x="600" y="215" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15.5" letter-spacing="4.5" fill="#d5b06d">AGENTES IA SELF-HOSTED</text>

  <text x="600" y="256" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#d8d2c5" fill-opacity="0.85">Chat agéntico · Aprobaciones · Voz · Telegram · Triggers · Traza total</text>
</svg>
